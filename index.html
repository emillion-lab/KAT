<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Пътен Монитор — София</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--surf:#12151c;--surf2:#171b24;--border:#232836;--txt:#e8ebf2;
--dim:#8892a6;--cyan:#5fb3ff;--good:#22c55e;--warn:#fbbf24;--bad:#ef4444;--orange:#f97316}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
padding-bottom:40px;-webkit-font-smoothing:antialiased}
.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.tab{flex:1;padding:14px 8px;text-align:center;font-size:.78rem;letter-spacing:.08em;color:var(--dim);
cursor:pointer;border-bottom:2px solid transparent;font-family:'Space Mono',monospace}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.wrap{max-width:820px;margin:0 auto;padding:14px 16px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.head h1{font-size:1.15rem;font-weight:700}
.head p{font-size:.72rem;color:var(--dim);margin-top:3px}
.lang{background:var(--surf);border:1px solid var(--border);color:var(--dim);padding:5px 11px;
border-radius:6px;font-size:.7rem;cursor:pointer;font-family:'Space Mono',monospace;flex-shrink:0}
.panel{display:none}.panel.on{display:block}
.signal{border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid var(--border);background:var(--surf)}
.signal.lv0{background:#061510;border-color:#1a4030}.signal.lv1{background:#12151c}
.signal.lv2{background:#161006;border-color:#40300a}.signal.lv3{background:#160808;border-color:#401010}
.slabel{font-size:.62rem;letter-spacing:.1em;color:var(--dim);font-family:'Space Mono',monospace}
.sday{font-size:1.45rem;font-weight:700;margin:5px 0 3px}
.ssub{font-size:.82rem;color:var(--dim);margin-bottom:14px}
.scales{display:flex;gap:26px}
.slab{font-size:.62rem;letter-spacing:.06em;color:var(--dim);margin-bottom:2px}
.sval{font-family:'Space Mono',monospace;font-size:2.1rem;font-weight:700;line-height:1.1}
.gapnote{font-size:.75rem;color:var(--dim);margin-top:10px;line-height:1.45;max-width:420px}
.mvr{display:flex;flex-wrap:wrap;gap:10px;font-size:.73rem;padding:10px 12px;border-radius:9px;
background:var(--surf);border:1px solid var(--border);margin-bottom:12px;color:var(--dim)}
.mvr.fresh{border-color:#1a4030}.mvr-n{color:var(--txt)}.mvr-reg{margin-left:auto}
.expl{font-size:.76rem;color:var(--dim);line-height:1.55;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.fc{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:11px}
.fc-h{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.06em;color:var(--dim)}
.fc-v{font-family:'Space Mono',monospace;font-size:1.05rem;font-weight:700;margin:5px 0 2px}
.fc-e{font-size:.66rem;color:var(--dim);font-family:'Space Mono',monospace}
.fc-bw{height:3px;background:var(--surf2);border-radius:2px;margin-top:7px;overflow:hidden}
.fc-b{height:100%;border-radius:2px}
.obs-h{grid-column:1/-1;font-size:.68rem;color:var(--dim);margin:14px 0 2px;letter-spacing:.04em}
.fc.obs{opacity:.5}.fc.obs .fc-bw{visibility:hidden}
.fday{background:var(--surf);border:1px solid var(--border);border-radius:11px;padding:14px;margin-bottom:11px}
.fd-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.fd-date{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--cyan)}
.fd-name{font-size:1rem;font-weight:700;margin-top:2px}
.fd-sub{font-size:.74rem;color:var(--dim);margin-top:10px}
.badge{font-size:.68rem;padding:4px 10px;border-radius:6px;font-family:'Space Mono',monospace;white-space:nowrap}
.b0{background:#06301f;color:#4ade80}.b1{background:#1a1f2b;color:var(--dim)}
.b2{background:#2b1d06;color:var(--warn)}.b3{background:#2b0d0d;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chips span{font-size:.68rem;background:var(--surf2);border:1px solid var(--border);
padding:4px 8px;border-radius:6px;color:var(--dim);font-family:'Space Mono',monospace}
.card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.ct{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:var(--cyan);margin-bottom:11px}
.legend{font-size:.7rem;color:var(--dim);margin-bottom:10px}
.sub{font-size:.66rem;letter-spacing:.08em;color:var(--dim);margin:14px 0 8px;font-family:'Space Mono',monospace}
.ht{width:100%;border-collapse:collapse;font-size:.74rem}
.ht td{padding:3px 5px}.ht td:first-child{color:var(--dim);width:34px;font-family:'Space Mono',monospace}
.ht td.n{font-family:'Space Mono',monospace;text-align:right;width:42px;color:var(--dim)}
.ht.bt th{font-size:.64rem;color:var(--dim);text-align:center;padding:5px;font-weight:400;
border-bottom:1px solid var(--border);font-family:'Space Mono',monospace}
.ht.bt th:first-child{text-align:left}
.ht.bt td{text-align:center;font-family:'Space Mono',monospace;border-bottom:1px solid #1a1e28;width:auto}
.ht.bt td:first-child{text-align:left;color:var(--dim)}
.hb{height:7px;background:var(--surf2);border-radius:4px;overflow:hidden}
.hb div{height:100%;border-radius:4px}
.note{font-size:.74rem;color:var(--dim);line-height:1.55;margin-top:11px}
.mh{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.08em;color:var(--cyan);margin:14px 0 7px}
.mrow{font-size:.77rem;line-height:1.55;padding:6px 0;border-bottom:1px dashed var(--border)}
.dim{color:var(--dim)}
footer{text-align:center;font-size:.66rem;color:#4a5260;padding:22px 16px;line-height:1.7}
</style>
</head>
<body>

<div class="tabs">
  <div class="tab on" data-p="today">ДНЕС</div>
  <div class="tab" data-p="forecast">3 ДНИ</div>
  <div class="tab" data-p="history">ИСТОРИЯ</div>
</div>

<div class="wrap">
  <div class="head">
    <div>
      <h1>🛣️ Пътен Монитор — София</h1>
      <p>Метео · Празници · МВР данни 2015–2025</p>
    </div>
    <button class="lang" id="lang-btn">EN / БГ</button>
  </div>

  <div class="panel on" id="p-today">
    <div class="signal lv1" id="today-box">
      <div class="slabel">ОЦЕНКА НА ДЕНЯ</div>
      <div class="sday" id="today-day">Зареждане…</div>
      <div class="ssub" id="today-sub"></div>
      <div id="today-scores"></div>
    </div>
    <div id="mvr"></div>
    <div class="expl" id="expl"></div>
    <div class="grid" id="factors"></div>
  </div>

  <div class="panel" id="p-forecast"><div id="forecast"></div></div>
  <div class="panel" id="p-history"><div id="history"></div></div>
</div>

<footer>
  Open-Meteo · МВР 2015–2025<br>
  <span id="upd"></span>
</footer>

<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="history.js"></script>
<script>
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.getElementById('p-'+t.dataset.p).classList.add('on');
});
document.getElementById('lang-btn').onclick=()=>{
  lang = lang==='bg'?'en':'bg';
  localStorage.setItem('kat-lang',lang);
  render();
};
document.getElementById('expl').innerHTML =
  '📊 Моделът е калибриран върху 4018 дни реални данни от МВР (2015–2025). '
+ 'Показва <b>относителна</b> оценка, не брой катастрофи. Скалата е стръмна — '
+ '10 се пада няколко пъти годишно. В раздел „История“ са коефициентите, '
+ 'проверката върху невиждани месеци и това какво е тествано и отпаднало.';
document.getElementById('upd').textContent =
  'Обновено: ' + new Date().toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'});
boot();
</script>
</body>
</html>
