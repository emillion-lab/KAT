name: probe-map-network
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install headless browser
        run: npm i puppeteer@22

      - name: Open the MVR map and record every request it makes
        continue-on-error: true
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          /* Суровият HTML не съдържа адреса на данните — картата го строи с
             JavaScript при зареждане. Затова отваряме страницата в истински
             браузър и записваме всяка мрежова заявка, която тя прави. */
          const PAGES = [
            'https://www.mvr.bg/ptp',
            'https://www.mvr.bg/opp',
            'https://www.mvr.bg',
          ];

          (async () => {
            const out = [];
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']
            });

            for (const url of PAGES) {
              const page = await browser.newPage();
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
              await page.setViewport({width:1400, height:1000});

              const seen = new Set();
              page.on('request', r => {
                const u = r.url();
                if (/arcgis|rest\/services|FeatureServer|MapServer|\/query|\.json|api/i.test(u)) {
                  seen.add(r.method() + ' ' + u);
                }
              });
              page.on('response', async r => {
                const u = r.url();
                if (/rest\/services|FeatureServer|MapServer|\/query/i.test(u)) {
                  let note = r.status() + '';
                  try {
                    const t = (await r.text()).slice(0, 300);
                    note += ' :: ' + t.replace(/\s+/g,' ');
                  } catch (e) { note += ' :: <no body>'; }
                  seen.add('RESP ' + u + '  ==> ' + note);
                }
              });

              out.push('══════ ' + url + ' ══════');
              try {
                await page.goto(url, {waitUntil:'networkidle2', timeout:70000});
                /* картата може да се зареди в iframe или след превъртане */
                await page.evaluate(() => window.scrollBy(0, 2000));
                await new Promise(r => setTimeout(r, 9000));
                const frames = page.frames().map(f => f.url()).filter(u => u && u !== 'about:blank');
                out.push('IFRAMES: ' + JSON.stringify(frames, null, 1));
              } catch (e) {
                out.push('NAV FAIL: ' + e.message);
              }
              out.push(...[...seen].sort());
              out.push('');
              await page.close();
            }

            await browser.close();
            fs.mkdirSync('data', {recursive:true});
            fs.writeFileSync('data/map_network.txt', out.join('\n'), 'utf8');
            console.log(out.join('\n'));
          })();
          EOF
          node probe.js || echo "PROBE FAILED"

      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          mkdir -p data
          touch data/map_network.txt
          git add data/map_network.txt
          git commit -m "map network probe [skip ci]" || true
          git fetch origin main && git rebase origin/main || true
          git push
