name: probe-map-network
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install headless browser
        run: npm i puppeteer@22 2>&1 | tail -5

      - name: Find the map page, then record its network calls
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const out = [];
          const P = (...a) => { const s = a.join(' '); out.push(s); console.log(s); };

          /* Първо намираме къде е самата карта: обхождаме mvr.bg за връзки,
             съдържащи "карта"/"map"/"ptp"/"произшест". После отваряме всяка и
             записваме мрежовите ѝ заявки. Суровият HTML не съдържа адреса на
             данните — той се строи с JavaScript при зареждане. */
          const START = ['https://www.mvr.bg/ptp','https://www.mvr.bg/opp','https://www.mvr.bg'];

          (async () => {
            const browser = await puppeteer.launch({headless:'new',
              args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' +
                       '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';

            // ── фаза 1: намиране на страницата с картата ──
            const mapUrls = new Set();
            for (const url of START) {
              const page = await browser.newPage();
              await page.setUserAgent(UA);
              try {
                const resp = await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
                P(`[open] ${resp && resp.status()} ${url}`);
                const links = await page.evaluate(() =>
                  Array.from(document.querySelectorAll('a[href]')).map(a => a.href + ' | ' + a.textContent.trim().slice(0,60)));
                P(`  връзки: ${links.length}`);
                for (const l of links) {
                  if (/карта|map|ptp|произшест|катастроф|инцидент|gis/i.test(l)) {
                    P('  ► ' + l.slice(0,160));
                    mapUrls.add(l.split(' | ')[0]);
                  }
                }
              } catch (e) { P(`[open] FAIL ${url} -> ${e.message}`); }
              await page.close();
            }
            P('', `кандидат-страници с карта: ${mapUrls.size}`, '');

            // ── фаза 2: мрежови заявки на всяка кандидат-страница ──
            const targets = [...mapUrls].slice(0, 6).concat(START);
            for (const url of targets) {
              const page = await browser.newPage();
              await page.setUserAgent(UA);
              await page.setViewport({width:1400, height:1000});
              const seen = new Set();
              page.on('request', r => {
                const u = r.url();
                if (/arcgis|rest\/services|FeatureServer|MapServer|\/query|api/i.test(u))
                  seen.add('REQ  ' + u.slice(0,220));
              });
              page.on('response', async r => {
                const u = r.url();
                if (/rest\/services|FeatureServer|MapServer|\/query/i.test(u)) {
                  let n = r.status() + '';
                  try { n += ' :: ' + (await r.text()).slice(0,200).replace(/\s+/g,' '); }
                  catch { n += ' :: <no body>'; }
                  seen.add('RESP ' + u.slice(0,180) + '  ==> ' + n);
                }
              });
              P('══════ ' + url + ' ══════');
              try {
                await page.goto(url, {waitUntil:'networkidle2', timeout:70000});
                await page.evaluate(() => window.scrollBy(0, 2500));
                await new Promise(r => setTimeout(r, 10000));
                const frames = page.frames().map(f=>f.url()).filter(u=>u && u!=='about:blank');
                if (frames.length > 1) P('IFRAMES: ' + frames.join('  |  '));
              } catch (e) { P('NAV FAIL: ' + e.message); }
              if (seen.size === 0) P('  (никакви заявки към ArcGIS/API)');
              [...seen].sort().forEach(s => P('  ' + s));
              P('');
              await page.close();
            }

            await browser.close();
            fs.mkdirSync('data', {recursive:true});
            fs.writeFileSync('data/map_network.txt', out.join('\n'), 'utf8');
          })().catch(e => {
            out.push('FATAL: ' + e.stack);
            fs.mkdirSync('data', {recursive:true});
            fs.writeFileSync('data/map_network.txt', out.join('\n'), 'utf8');
            process.exitCode = 1;
          });
          EOF
          node probe.js

      - name: Commit result
        if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          mkdir -p data
          [ -f data/map_network.txt ] || echo "скриптът не стигна до запис" > data/map_network.txt
          git add -f data/map_network.txt
          git commit -m "map network probe [skip ci]" || echo "no change"
          git fetch origin main && git rebase origin/main || true
          git push
