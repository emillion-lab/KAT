name: KAT v2 probe traffic
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 v2/probe_traffic.py 2>&1 | tee v2/traffic_probe.txt
      - if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          git add v2/traffic_probe.txt && git commit -m "v2 traffic probe [skip ci]" || echo "no change"
          git pull --rebase || true
          git push
