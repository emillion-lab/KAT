name: KAT v2 day probe
on:
  workflow_dispatch:
    inputs:
      start: { description: 'от', default: '2026-10-01' }
      end:   { description: 'до', default: '2026-10-08' }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 v2/day_probe.py "${{ github.event.inputs.start }}" "${{ github.event.inputs.end }}" | tee v2/probe.txt
      - run: |
          git config user.name ci; git config user.email ci@kat
          git add v2/probe.txt && git commit -m "v2 day probe [skip ci]" || echo "no change"
          git pull --rebase || true
          git push
