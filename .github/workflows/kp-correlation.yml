name: Kp Correlation
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Kp history and correlate
        run: |
          curl -fsSL "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json" -o kp_raw.json || echo "[]" > kp_raw.json
          wc -c kp_raw.json
          python3 - <<'PY'
          import json, math, datetime, collections

          # ── Kp по дни (NOAA дава 3-часови стойности) ──
          kp_daily = collections.defaultdict(list)
          try:
              raw = json.load(open('kp_raw.json'))
              hdr = raw[0]
              ti = hdr.index('time_tag'); ki = hdr.index('Kp') if 'Kp' in hdr else 1
              for row in raw[1:]:
                  day = row[ti][:10]
                  try: kp_daily[day].append(float(row[ki]))
                  except: pass
          except Exception as e:
              print('Kp грешка:', e)
          kp_max = {d: max(v) for d, v in kp_daily.items()}
          kp_avg = {d: sum(v)/len(v) for d, v in kp_daily.items()}
          print('Kp дни:', len(kp_max))

          acc = json.load(open('data/mvr_accidents.json'))['days']
          MOON_REF = datetime.datetime(2000,1,6,18,14, tzinfo=datetime.timezone.utc)
          SYN = 29.530588853

          rows = []
          for r in acc:
              d = r['date']
              if d not in kp_max: continue
              if r.get('dead') is None and r.get('injured') is None: continue
              dt = datetime.datetime.strptime(d, '%Y-%m-%d').replace(tzinfo=datetime.timezone.utc)
              age = ((dt - MOON_REF).total_seconds()/86400) % SYN
              rows.append({'date': d, 'kpmax': kp_max[d], 'kpavg': kp_avg[d],
                           'dow': dt.weekday(), 'moon': abs(0.5 - age/SYN),
                           'dead': r.get('dead'), 'injured': r.get('injured')})
          print('припокриващи се дни:', len(rows))

          def pearson(xs, ys):
              n=len(xs)
              if n<8: return None
              mx,my=sum(xs)/n,sum(ys)/n
              num=sum((a-mx)*(b-my) for a,b in zip(xs,ys))
              dx=math.sqrt(sum((a-mx)**2 for a in xs)); dy=math.sqrt(sum((b-my)**2 for b in ys))
              return num/(dx*dy) if dx and dy else None

          out = ['# Корелационен анализ — Kp срещу произшествия', '']
          out.append(f'Период: {min(r["date"] for r in rows)} → {max(r["date"] for r in rows)}')
          out.append(f'Дни с припокриване: {len(rows)}')
          out.append('')

          for metric in ['dead','injured']:
              sub=[r for r in rows if r[metric] is not None]
              if len(sub)<8: continue
              ys=[r[metric] for r in sub]
              out.append(f'## {metric} — {len(sub)} дни, средно {sum(ys)/len(ys):.1f}')
              for name,key in [('Kp максимум','kpmax'),('Kp среден','kpavg'),('близост до пълнолуние','moon')]:
                  r_=pearson([r[key] for r in sub], ys)
                  if r_ is None: continue
                  crit=1.96/math.sqrt(len(sub)-3)
                  z=0.5*math.log((1+r_)/(1-r_)) if abs(r_)<0.999 else 0
                  sig='ЗНАЧИМО' if abs(z)>crit else 'шум'
                  out.append(f'- {name}: r = {r_:+.3f}  ({sig})')
              # обърнато U: ниско/средно/високо Kp
              lo=[r[metric] for r in sub if r['kpmax']<3]
              mid=[r[metric] for r in sub if 3<=r['kpmax']<5]
              hi=[r[metric] for r in sub if r['kpmax']>=5]
              def m(v): return f'{sum(v)/len(v):.1f} (n={len(v)})' if v else '—'
              out.append(f'- по ниво Kp: ниско<3 {m(lo)} · средно 3-5 {m(mid)} · високо≥5 {m(hi)}')
              out.append('')

          open('kp-correlation.md','w').write('\n'.join(out))
          print('\n'.join(out))
          PY
          rm -f kp_raw.json
          git config user.name ci; git config user.email ci@kat
          git add kp-correlation.md && git commit -m "kp correlation [skip ci]" || true
          git push
