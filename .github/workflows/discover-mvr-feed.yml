name: discover-mvr-feed
on:
  workflow_dispatch:
  schedule:
    # push-тригерът в това репо не се задейства; cron работи.
    # Еднократна задача — спира сама, щом отчетът е записан.
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Skip if report already exists
        id: chk
        run: |
          if [ -f debug/mvr-feed-probe.txt ]; then
            echo "done=1" >> $GITHUB_OUTPUT; echo "report exists"
          else
            echo "done=0" >> $GITHUB_OUTPUT
          fi
      - name: Probe
        if: steps.chk.outputs.done == '0'
        continue-on-error: true
        run: |
          mkdir -p debug
          python3 scripts/discover_mvr_feed.py > debug/mvr-feed-probe.txt 2>&1 || echo NONZERO >> debug/mvr-feed-probe.txt
      - name: Show
        if: always()
        run: cat debug/mvr-feed-probe.txt || true
      - name: Commit
        if: steps.chk.outputs.done == '0'
        run: |
          git config user.name bot; git config user.email bot@kat
          git add -A
          git commit -m "MVR feed discovery probe [skip ci]" || true
          git fetch origin main && git rebase origin/main || true
          git push
