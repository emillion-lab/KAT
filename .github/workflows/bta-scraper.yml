name: BTA Scraper
on:
  schedule: [{ cron: '40 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe BTA — RSS, sitemap, pagination
        continue-on-error: true
        run: python3 scraper/bta_probe2.py
      - name: Scrape BTA
        continue-on-error: true
        run: python3 scraper/bta.py
      - name: Show logs
        if: always()
        run: |
          echo "───── PROBE 2 ─────"; cat data/bta_probe2.txt || echo "no probe2"
          echo "───── SCRAPE ─────";  cat data/bta_log.txt   || echo "no log"
      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          mkdir -p data
          git add -f data/bta_probe2.txt data/bta_daily.json data/bta_log.txt || true
          git commit -m "BTA probe2 [skip ci]" || echo "no change"
          git fetch origin main && git rebase origin/main || true
          git push
