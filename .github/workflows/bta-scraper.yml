name: BTA Scraper
on:
  # cron */15 спрян на 10.11.2026: последният цикъл прегледа 425 статии и намери
  # 0 нови дни, а bta_daily.json не се чете от модела (engine.js чете само
  # mvr_accidents.json). Остава за ръчно пускане и през .run.
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # Пипването на .run пуска цикъла веднага — така се иска ръчно
      # изпълнение, без достъп до Actions бутона (напр. от телефон).
      - '.run'
      - 'scraper/bta.py'
      - 'scripts/fix_bta_*.py'
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending fixes
        run: |
          if ! grep -q 'MENU_END' scraper/bta.py; then
            python3 scripts/fix_bta_text.py && echo "text fix applied"
          fi
          if ! grep -q 'range(1, 26)' scraper/bta.py; then
            python3 scripts/fix_bta_depth.py && echo "depth fix applied"
          fi
          python3 -m py_compile scraper/bta.py && echo "compile OK"

      - name: Scrape
        continue-on-error: true
        run: python3 scraper/bta.py

      - name: Show
        if: always()
        run: cat data/bta_log.txt || true

      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          mkdir -p data
          git add -f data/bta_daily.json data/bta_log.txt scraper/bta.py 2>/dev/null || true
          git commit -m "BTA cycle [skip ci]" || echo "no change"
          git fetch origin main && git rebase origin/main || true
          git push
