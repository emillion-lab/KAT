name: BTA Scraper
on:
  schedule: [{ cron: '40 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply text-extraction fix
        run: |
          if ! grep -q 'MENU_END' scraper/bta.py; then
            python3 scripts/fix_bta_text.py
            python3 -m py_compile scraper/bta.py && echo "compile OK"
            git config user.name ci; git config user.email ci@kat
            git add scraper/bta.py
            git commit -m "bta: fix text extraction [skip ci]" || true
          else
            echo "fix already applied"
          fi
      - name: Scrape BTA
        continue-on-error: true
        run: python3 scraper/bta.py
      - name: Show log
        if: always()
        run: cat data/bta_log.txt || echo "no log"
      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          mkdir -p data
          git add -f data/bta_daily.json data/bta_log.txt scraper/bta.py || true
          git commit -m "BTA daily data [skip ci]" || echo "no change"
          git fetch origin main && git rebase origin/main || true
          git push
