name: BTA Scraper
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending text-extraction fix
        run: |
          if ! grep -q 'MENU_END' scraper/bta.py; then
            python3 scripts/fix_bta_text.py && python3 -m py_compile scraper/bta.py && echo "fix applied"
          else
            echo "fix already applied"
          fi

      - name: Diagnostics
        continue-on-error: true
        run: python3 scraper/bta_diag.py

      - name: Scrape
        continue-on-error: true
        run: python3 scraper/bta.py

      - name: Show
        if: always()
        run: |
          echo "──── DIAG ────"; cat data/bta_diag.txt || true
          echo "──── LOG ────";  cat data/bta_log.txt  || true

      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          mkdir -p data
          git add -f data/bta_diag.txt data/bta_daily.json data/bta_log.txt scraper/bta.py 2>/dev/null || true
          git commit -m "BTA cycle [skip ci]" || echo "no change"
          git fetch origin main && git rebase origin/main || true
          git push
