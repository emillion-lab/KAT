name: Daily Archive
on:
  schedule: [{ cron: '0 21 * * *' }, { cron: '*/20 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending patches
        run: |
          set -e
          CHANGED=0
          if grep -q 'harmScore' index.html && ! grep -q 'sl-harm' index.html; then
            echo ">>> UI v4"; python3 scripts/patch_ui_v4.py; CHANGED=1
          fi
          if grep -q 'sl-harm' index.html && ! grep -q 'methodologyBlock' index.html; then
            echo ">>> v5"; python3 scripts/patch_v5.py; CHANGED=1
          fi
          if grep -q "wd\['k'+i\]" index.html; then
            echo ">>> v6"; python3 scripts/patch_v6.py; CHANGED=1
          fi
          if [ "$CHANGED" = "1" ]; then
            python3 -c "
          import io,re
          h=io.open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*)</script>',h,re.S)
          io.open('/tmp/c.js','w',encoding='utf-8').write(m.group(1))
          "
            node --check /tmp/c.js
            echo ">>> syntax OK"
            git config user.name ci; git config user.email ci@kat
            git add index.html
            git commit -m "KAT patches applied [skip ci]"
            git push
            echo ">>> pushed"
          else
            echo ">>> nothing pending"
          fi

      - name: Daily archive
        if: github.event.schedule == '0 21 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools_daily_archive.py 2>&1 | tee run.log
          git config user.name ci; git config user.email ci@kat
          git add data/daily_archive.json run.log && git commit -m "daily archive [skip ci]" || echo "no change"
          git pull --rebase || true
          git push
