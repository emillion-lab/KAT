name: Daily Archive
on:
  schedule: [{ cron: '0 21 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools_daily_archive.py 2>&1 | tee run.log
      - run: |
          git config user.name ci; git config user.email ci@kat
          git add data/daily_archive.json run.log && git commit -m "daily archive [skip ci]" || echo "no change"
          git push
