name: Daily Archive
on:
  schedule: [{ cron: '0 21 * * *' }, { cron: '*/20 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending patches
        run: |
          set -e
          CHANGED=0
          if ! grep -q 'injured_base' engine.js; then
            echo ">>> regime patch"; python3 scripts/patch_regime.py; CHANGED=1
          fi
          if [ "$CHANGED" = "1" ]; then
            node --check engine.js
            echo ">>> syntax OK"
            git config user.name ci; git config user.email ci@kat
            git add engine.js
            git commit -m "engine: enable regime with regional-headline filter [skip ci]"
            git fetch origin main && git rebase origin/main || true
            git push
            echo ">>> pushed"
          else
            echo ">>> nothing pending"
          fi

      - name: Daily archive
        if: github.event.schedule == '0 21 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools_daily_archive.py 2>&1 | tee run.log
          git config user.name ci; git config user.email ci@kat
          git add data/daily_archive.json run.log && git commit -m "daily archive [skip ci]" || echo "no change"
          git pull --rebase || true
          git push
