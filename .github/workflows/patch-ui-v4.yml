name: Patch UI V4
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -q 'sl-harm' index.html; then echo "already applied"; exit 0; fi
          if ! grep -q 'harmScore' index.html; then echo "v3 not applied yet, waiting"; exit 0; fi
          python3 scripts/patch_ui_v4.py
          python3 -c "
          import io,re
          h=io.open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*)</script>',h,re.S)
          io.open('/tmp/c.js','w',encoding='utf-8').write(m.group(1))
          "
          node --check /tmp/c.js
          grep -c 'sl-harm' index.html
          grep -c 'Очаквани ~' index.html || echo "count forecast removed OK"
          git config user.name ci; git config user.email ci@kat
          git add index.html && git commit -m "UI v4: two scales on screen, drop count forecast [skip ci]" || echo "no change"
          git push
