name: KAT v2 analysis
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Начална дата (YYYY-MM-DD)'
        default: '2026-05-25'
permissions:
  contents: write
jobs:
  v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas numpy statsmodels
      - name: Fetch weather
        run: python3 v2/fetch_weather.py "${{ github.event.inputs.start || '2026-05-25' }}"
      - name: Analyze
        run: python3 v2/analyze.py | tee v2/run.log
      - name: Commit
        run: |
          git config user.name ci; git config user.email ci@kat
          git add v2/ && git commit -m "v2 analysis [skip ci]" || echo "no change"
          git pull --rebase || true
          git push
