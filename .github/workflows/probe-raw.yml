name: probe-mvr-folder
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raw dump of folder JSON
        run: |
          python3 - <<'EOF'
          import urllib.request, json
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u):
              req=urllib.request.Request(u,headers=UA)
              return urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          out=[]
          for path in ["MVR_Incident","GISMVR_EVENTS","MVR_APP","RS_GEOEVENT","Hosted"]:
              url=f"https://gis.mvr.bg/arcgis/rest/services/{path}?f=json"
              try:
                  body=get(url)
                  out.append(f"=== {path} ===\n{body[:3000]}\n")
              except Exception as ex:
                  out.append(f"=== {path} FAILED: {ex} ===\n")
          open('data/raw_probe.txt','w',encoding='utf-8').write('\n'.join(out))
          print('\n'.join(out))
          EOF
      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@kat
          mkdir -p data
          git add data/raw_probe.txt
          git commit -m "raw folder probe [skip ci]" || true
          git fetch origin main && git rebase origin/main || true
          git push
