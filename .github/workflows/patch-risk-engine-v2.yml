name: patch-risk-engine-v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_engine_v2.py'
      - '.github/workflows/patch-risk-engine-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recalibration
        run: python3 scripts/patch_engine_v2.py
      - name: JS syntax check
        run: |
          python3 -c "
          import io,re
          h=io.open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*)</script>',h,re.S)
          io.open('/tmp/check.js','w',encoding='utf-8').write(m.group(1))
          "
          node --check /tmp/check.js && echo 'JS SYNTAX OK'
      - name: Smoke test the new engine
        run: |
          node -e "
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const js=h.match(/<script>([\s\S]*)<\/script>/)[1];
          const stub=()=>({textContent:'',style:{},innerHTML:'',className:'',
            classList:{toggle:()=>{},contains:()=>false},appendChild:()=>{},contains:()=>false,
            addEventListener:()=>{},getContext:()=>null,offsetWidth:400});
          global.document={getElementById:stub,querySelectorAll:()=>[]};
          global.fetch=()=>Promise.reject(new Error('no net'));
          global.setInterval=()=>{}; global.setTimeout=()=>{};
          global.window={};
          eval(js);
          const tests=[
            ['Сухо слънчево, вторник', new Date('2026-03-10T12:00:00'), {rain:0,snow:0,sun:0.9}],
            ['Проливен дъжд, петък',   new Date('2026-03-13T12:00:00'), {rain:25,snow:0,sun:0.1}],
            ['Сняг 6cm, понеделник',   new Date('2026-01-12T12:00:00'), {rain:2,snow:6,sun:0.1,tmin:-3}],
            ['23 декември',            new Date('2026-12-23T12:00:00'), {rain:0,snow:0,sun:0.5}],
            ['Коледа',                 new Date('2026-12-25T12:00:00'), {rain:0,snow:0,sun:0.5}],
            ['Неделя слънчево, март',  new Date('2026-03-15T12:00:00'), {rain:0,snow:0,sun:0.95}],
          ];
          let bad=0;
          for(const [name,d,env] of tests){
            const r=calcRisk(env,d,{noRegime:true});
            if(!(r.riskScore>=1&&r.riskScore<=10)) bad++;
            console.log(String(name).padEnd(25),'score='+r.riskScore+'/10','mult='+r.totalMult.toFixed(3),'exp='+r.expected);
          }
          if(bad){console.error('FAIL: '+bad+' score(s) out of range');process.exit(1);}
          if(kpEffect(9)!==1.0||moonEffect(14)!==1.0){console.error('FAIL: dropped factors still active');process.exit(1);}
          console.log('SMOKE TEST OK');
          "
      - name: Commit
        run: |
          git config user.name bot; git config user.email bot@kat
          git add index.html
          git commit -m "risk engine v2: recalibrated on MVR 2015-2025; drop Kp/moon/pressure; 1-10 decile scale" || true
          git push
